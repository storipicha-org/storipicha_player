name: storipicha_player
description: "A federated Flutter video player plugin powered by Media3 ExoPlayer."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  # 1️⃣ Shared platform interface contract
  storipicha_player_platform_interface:
    path: ../storipicha_player_platform_interface
  # 2️⃣ Default Android implementation
  storipicha_player_android:
    path: ../storipicha_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 3️⃣ Registers the platform mapping for Flutter build tooling
flutter:
  plugin:
    platforms:
      android:
        default_package: storipicha_player_android